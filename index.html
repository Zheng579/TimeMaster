<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="style.css">
    <title>Time Master</title>
</head>
<body>
    <div id="time" class="container">
        <div class="grd-page-container">
            <div id="clock">
                <div id="date" class="date"></div>
                <div class="circle" style="--clr:#ff2972;">
                    <div class="dots hr_dot"></div>
                    <svg>
                        <circle cx="70" cy="70" r="70"></circle>
                        <circle cx="70" cy="70" r="70" id="hh"></circle>
                    </svg>
                    <div id="hours">00</div>
                </div>
                <div class="circle" style="--clr:#fee800;"  >
                    <div class="dots min_dot"></div>
                    <svg>
                        <circle cx="70" cy="70" r="70"></circle>
                        <circle cx="70" cy="70" r="70" id="mm"></circle>
                    </svg>
                    <div id="minutes">00</div>
                </div>
                <div class="circle" style="--clr:#04fc43;">
                    <div class="dots sec_dot"></div>
                    <svg>
                        <circle cx="70" cy="70" r="70"></circle>
                        <circle cx="70" cy="70" r="70" id="ss"></circle>
                    </svg>
                    <div id="seconds">00</div>
                </div>
                <div class="ap">
                    <div id="ampm">上 午</div>
                </div>
            </div>

            <div class="log-alarm-layout">
                <aside class="alarm-control-panel" id="alarmControlPanel">
                    <section class="control-panel-group is-expanded">
                        <button class="control-panel-group__header" type="button" aria-expanded="true" aria-controls="logGroupContent" data-control-group-toggle>
                            <span id="logGroupTitle">Log</span>
                            <span class="control-panel-group__arrow" aria-hidden="true">▲</span>
                        </button>
                        <div class="control-panel-group__content" id="logGroupContent">
                            <button class="button time-entry-btn" id="logTimeStartBtn" type="button" title="Shortcut: Enter" aria-keyshortcuts="Tab">Set start time</button>
                            <button class="button time-entry-btn" id="logTimeBtn" type="button" title="Shortcut: Space" aria-keyshortcuts="Space">Current time</button>
                            <button class="button time-entry-btn" id="logHighlightedTimeBtn" type="button" title="Shortcut: Shift" aria-keyshortcuts="Shift">Highlight time</button>
                            <button class="button time-entry-btn" id="deleteLastLogBtn" type="button" title="Shortcut: Backspace" aria-keyshortcuts="Backspace">Delete last entry</button>
                            <button class="button time-entry-btn" id="clearLogBtn" type="button" title="Shortcut: Esc" aria-keyshortcuts="Escape">Clear all</button>
                        </div>
                    </section>
                    <section class="control-panel-group is-expanded">
                        <button class="control-panel-group__header" type="button" aria-expanded="true" aria-controls="displayGroupContent" data-control-group-toggle>
                            <span id="displayGroupTitle">Display</span>
                            <span class="control-panel-group__arrow" aria-hidden="true">▲</span>
                        </button>
                        <div class="control-panel-group__content" id="displayGroupContent">
                            <button class="button time-entry-btn" id="fullscreenClockBtn" type="button">Show Clock Only</button>
                            <button class="button time-entry-btn" id="toggleFormatBtn" type="button">Switch to 24h</button>
                        </div>
                    </section>
                    <section class="control-panel-group is-expanded">
                        <button class="control-panel-group__header" type="button" aria-expanded="true" aria-controls="languageGroupContent" data-control-group-toggle>
                            <span id="languageSelectLabel">Language</span>
                            <span class="control-panel-group__arrow" aria-hidden="true">▲</span>
                        </button>
                        <div class="control-panel-group__content" id="languageGroupContent">
                            <select class="language-select" id="languageSelect" aria-labelledby="languageSelectLabel">
                                <option value="en">English</option>
                                <option value="zh">中文（简体）</option>
                            </select>
                        </div>
                    </section>
                </aside>
                <div class="table-responsive">
                    <table class="table" aria-label="Logged time entries">
                        <thead>
                            <tr>
                                <th scope="col" style="width: 80px;" id="tableHeaderIndex">#</th>
                                <th scope="col" id="tableHeaderDate">Date</th>
                                <th scope="col" id="tableHeaderStartTime">Start Time</th>
                                <th scope="col" id="tableHeaderLoggedTime">Logged Time</th>
                                <th scope="col" id="tableHeaderDuration">Duration</th>
                                <th scope="col" id="tableHeaderLogInterval">Log Interval</th>
                            </tr>
                        </thead>
                        <tbody id="logTableBody"></tbody>
                    </table>
                </div>
                <aside class="timer-controls">
                    <button class="button timer-controls__stop-sound" id="alarmSoundStopBtn" type="button">
                        <span id="alarmSoundStopLabel">Stop Sound</span>
                        <span class="timer-controls__stop-sound-icon" aria-hidden="true">🔇</span>
                    </button>
                    <section class="timer-accordion" id="cycleTimerPanel">
                        <button class="timer-accordion__header" id="cycleTimerPanelToggleBtn" type="button" aria-expanded="false" aria-controls="cycleTimerPanelContent" data-timer-accordion-toggle>
                            <span id="cycleTimerTitle">Interval timer</span>
                            <span class="timer-accordion__arrow" aria-hidden="true">▼</span>
                        </button>
                        <div class="timer-accordion__content" id="cycleTimerPanelContent" hidden>
                            <div class="timer-panel__display" id="cycleTimerDisplay">00:00</div>
                            <div class="cycle-timer-panel__phase" id="cycleTimerPhase">Interval A · Cycle 1 of 1</div>
                            <div class="cycle-timer-panel__inputs">
                                <fieldset class="cycle-timer-panel__phase-inputs">
                                    <legend id="cycleTimerPhase1Label">Interval A</legend>
                                    <div class="timer-panel__inputs">
                                        <label>
                                            <span id="cycleTimerPhase1MinutesLabel">Min</span>
                                            <input type="number" id="cycleTimerFocusMinutesInput" min="0" max="999" value="0">
                                        </label>
                                        <label>
                                            <span id="cycleTimerPhase1SecondsLabel">Sec</span>
                                            <input type="number" id="cycleTimerFocusSecondsInput" min="0" max="59" value="0">
                                        </label>
                                    </div>
                                </fieldset>
                                <fieldset class="cycle-timer-panel__phase-inputs">
                                    <legend id="cycleTimerPhase2Label">Interval B</legend>
                                    <div class="timer-panel__inputs">
                                        <label>
                                            <span id="cycleTimerPhase2MinutesLabel">Min</span>
                                            <input type="number" id="cycleTimerBreakMinutesInput" min="0" max="999" value="0">
                                        </label>
                                        <label>
                                            <span id="cycleTimerPhase2SecondsLabel">Sec</span>
                                            <input type="number" id="cycleTimerBreakSecondsInput" min="0" max="59" value="0">
                                        </label>
                                    </div>
                                </fieldset>
                                <div class="timer-panel__inputs">
                                    <label class="cycle-timer-panel__cycles">
                                        <span id="cycleTimerCyclesLabel">Cycles</span>
                                        <input type="number" id="cycleTimerCyclesInput" min="1" max="999" value="1">
                                    </label>
                                </div>
                            </div>
                            <div class="timer-panel__actions">
                                <button class="button timer-btn" id="cycleTimerStartBtn" type="button">Start</button>
                                <button class="button timer-btn" id="cycleTimerPauseBtn" type="button">Pause</button>
                                <button class="button timer-btn" id="cycleTimerStopBtn" type="button">Stop</button>
                                <button class="button timer-btn" id="cycleTimerResetBtn" type="button">Reset</button>
                            </div>
                            <div class="timer-panel__status" id="cycleTimerStatus">Set both interval durations and a cycle count.</div>
                        </div>
                    </section>
                    <section class="timer-accordion" id="timerPanel">
                        <button class="timer-accordion__header" id="timerPanelToggleBtn" type="button" aria-expanded="false" aria-controls="timerPanelContent" data-timer-accordion-toggle>
                            <span id="timerTitle">Timer</span>
                            <span class="timer-accordion__arrow" aria-hidden="true">▼</span>
                        </button>
                        <div class="timer-accordion__content" id="timerPanelContent" hidden>
                            <div class="timer-panel__display" id="timerDisplay">00:00</div>
                            <div class="timer-panel__inputs">
                                <label>
                                    <span id="timerMinLabel">Min</span>
                                    <input type="number" id="timerMinutesInput" min="0" max="999" value="0">
                                </label>
                                <label>
                                    <span id="timerSecLabel">Sec</span>
                                    <input type="number" id="timerSecondsInput" min="0" max="59" value="0">
                                </label>
                            </div>
                            <div class="timer-panel__actions">
                                <button class="button timer-btn standard-timer-btn" id="timerStartBtn" type="button">Start</button>
                                <button class="button timer-btn standard-timer-btn" id="timerPauseBtn" type="button">Pause</button>
                                <button class="button timer-btn standard-timer-btn" id="timerResetBtn" type="button">Reset</button>
                            </div>
                            <div class="timer-panel__status" id="timerStatus">No timer set.</div>
                        </div>
                    </section>
                    <section class="timer-accordion alarm-panel" id="alarmPanel" aria-live="polite">
                        <button class="timer-accordion__header" id="alarmPanelToggleBtn" type="button" aria-expanded="false" aria-controls="alarmPanelContent" data-timer-accordion-toggle>
                            <span id="clockPanelTitle">Clock</span>
                            <span class="timer-accordion__arrow" aria-hidden="true">▼</span>
                        </button>
                        <div class="timer-accordion__content" id="alarmPanelContent" hidden>
                            <div class="alarm-panel__row">
                                <span class="alarm-panel__label" id="alarmSetTimeLabel">Set Time</span>
                                <span class="alarm-panel__value" id="alarmPanelTime">--</span>
                            </div>
                            <div class="alarm-panel__row">
                                <span class="alarm-panel__label" id="alarmNextLabel">Next</span>
                                <span class="alarm-panel__value" id="alarmPanelNext">--</span>
                            </div>
                            <div class="alarm-panel__inputs">
                                <label>
                                    <span id="alarmTimeInputLabel">Alarm time</span>
                                    <input type="time" id="alarmTimeInlineInput">
                                </label>
                            </div>
                            <div class="alarm-panel__actions">
                                <button class="button alarm-btn" id="alarmSetBtn" type="button">Set</button>
                                <button class="button alarm-btn" id="alarmResetBtn" type="button">Reset</button>
                            </div>
                        </div>
                    </section>
                    <label class="timer-controls__sound-picker">
                        <span id="alarmSoundFileLabel">Alarm sound (MP3)</span>
                        <input id="alarmSoundFileInput" type="file" accept=".mp3,audio/mpeg" aria-describedby="alarmSoundFileStatus">
                        <span class="timer-controls__sound-status" id="alarmSoundFileStatus">Using default beep.</span>
                    </label>
                </aside>
            </div>

        </div>
    </div>

    <script src="translations.js"></script>
    <script src="script.js"></script>
</body>
</html>
